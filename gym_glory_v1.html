<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gloria // Gym Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  html, body {
    background: #0e1621 !important;
    background-color: #0e1621 !important;
    color: #c8dff0;
    margin: 0; padding: 0;
  }

  :root {
    --bg:        #0e1621;
    --surface:   #131f2e;
    --surface2:  #182333;
    --border:    #1e2f42;
    --border-hi: #2a4460;
    --text:      #c8dff0;
    --text-dim:  #3a5570;
    --text-mid:  #7aaac8;
    --c-a:       #7ecec4;
    --c-b:       #e0b96a;
    --c-r:       #e07b9f;
    --red:       #e07b7b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Press Start 2P', monospace;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 18px 80px;
    background: #0e1621;
    background-image: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px
    );
  }

  .page { width: 100%; max-width: 520px; }

  /* ── HEADER ── */
  .header {
    text-align: center;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .header-tag { font-size: 6px; color: var(--text-dim); letter-spacing: 3px; margin-bottom: 14px; }
  .header h1  { font-size: clamp(10px, 3vw, 14px); color: var(--text); letter-spacing: 2px; line-height: 1.8; }
  .header h1 span { color: var(--c-a); }

  .save-flash {
    font-size: 6px; color: var(--c-a); letter-spacing: 2px;
    text-align: center; height: 14px; margin-top: 12px;
    opacity: 0; transition: opacity 0.4s;
  }
  .save-flash.show { opacity: 1; }

  /* ── TABS ── */
  .tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 24px; }

  .tab {
    padding: 12px 0; text-align: center; font-size: 8px; letter-spacing: 2px;
    border: 1px solid var(--border); cursor: pointer; color: var(--text-dim);
    transition: all 0.15s; -webkit-tap-highlight-color: transparent;
  }
  .tab.active-a { border-color: var(--c-a); color: var(--c-a); background: rgba(126,206,196,0.06); }
  .tab.active-b { border-color: var(--c-b); color: var(--c-b); background: rgba(224,185,106,0.06); }
  .tab.active-r { border-color: var(--c-r); color: var(--c-r); background: rgba(224,123,159,0.06); }

  /* ── SECTION HEADING ── */
  .section-head { display: flex; align-items: center; gap: 12px; margin: 24px 0 14px; }
  .sh-txt { font-size: 8px; color: var(--text-dim); letter-spacing: 2px; white-space: nowrap; }
  .sh-line { flex: 1; height: 1px; background: var(--border); }

  /* ── EXERCISE ROWS ── */
  .exercise-list { display: flex; flex-direction: column; }

  .ex-row {
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .ex-row:first-child { border-top: 1px solid var(--border); }

  /* top line: name + mode button */
  .ex-top {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .ex-name-input {
    background: none;
    border: none;
    border-bottom: 1px solid transparent;
    color: var(--text);
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    letter-spacing: 1px;
    flex: 1;
    min-width: 0;
    outline: none;
    padding: 2px 0 4px;
    transition: border-color 0.2s;
    -webkit-appearance: none;
    border-radius: 0;
  }
  .ex-name-input::placeholder { color: var(--text-dim); }
  .ex-name-input:focus         { border-bottom-color: var(--border-hi); }
  .session-a .ex-name-input:focus { border-bottom-color: var(--c-a); }
  .session-b .ex-name-input:focus { border-bottom-color: var(--c-b); }
  .session-r .ex-name-input:focus { border-bottom-color: var(--c-r); }

  /* mode cycle button */
  .mode-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Press Start 2P', monospace;
    font-size: 5px;
    letter-spacing: 1px;
    padding: 4px 6px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
    line-height: 1.6;
  }
  .session-a .mode-btn:hover, .session-a .mode-btn.active { border-color: var(--c-a); color: var(--c-a); }
  .session-b .mode-btn:hover, .session-b .mode-btn.active { border-color: var(--c-b); color: var(--c-b); }
  .session-r .mode-btn:hover, .session-r .mode-btn.active { border-color: var(--c-r); color: var(--c-r); }

  /* controls grid */
  .ex-controls { display: grid; gap: 8px; }
  .ex-controls.three-col { grid-template-columns: 1fr 1fr 1fr; }
  .ex-controls.two-col   { grid-template-columns: 1fr 1fr; }

  .ex-ctrl { display: flex; flex-direction: column; gap: 6px; }

  .ex-ctrl-label { font-size: 6px; color: var(--text-dim); letter-spacing: 2px; text-align: center; }

  .ex-ctrl-row {
    display: flex; align-items: center;
    background: var(--surface); border: 1px solid var(--border);
  }

  .ctrl-btn {
    background: none; border: none;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px; color: var(--text-dim);
    cursor: pointer; width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.12s; user-select: none;
    -webkit-tap-highlight-color: transparent; flex-shrink: 0;
  }
  .ctrl-btn:active  { transform: scale(0.82); }
  .ctrl-btn.p:hover { color: var(--text); }
  .ctrl-btn.m:hover { color: var(--red); }

  .ctrl-val {
    flex: 1; font-size: 9px; text-align: center; line-height: 1;
    border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    padding: 6px 2px; white-space: nowrap;
  }
  .session-a .ctrl-val { color: var(--c-a); }
  .session-b .ctrl-val { color: var(--c-b); }
  .session-r .ctrl-val { color: var(--c-r); }

  .ctrl-val.bump { animation: bump 0.2s ease; }
  @keyframes bump {
    0%  { transform: scale(1);   }
    45% { transform: scale(1.3); }
    100%{ transform: scale(1);   }
  }

  /* ── NOTES ── */
  .notes-input {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    color: var(--text-mid); font-family: 'Press Start 2P', monospace;
    font-size: 7px; padding: 10px; resize: none; outline: none;
    line-height: 1.8; letter-spacing: 1px; transition: border-color 0.2s;
  }
  .notes-input:focus { border-color: var(--border-hi); }
  .notes-input::placeholder { color: var(--text-dim); }

  /* ── FOOTER ── */
  .footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border);
  }
  .footer-txt { font-size: 6px; color: var(--text-dim); letter-spacing: 2px; }

  .reset-btn {
    background: none; border: 1px solid var(--border); color: var(--text-dim);
    font-family: 'Press Start 2P', monospace; font-size: 6px;
    letter-spacing: 1px; padding: 7px 10px; cursor: pointer; transition: all 0.2s;
  }
  .reset-btn:hover { border-color: var(--red); color: var(--red); }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="header-tag">// GYM TRACKER</div>
    <h1>GLORIA <span>//</span> TRAINING</h1>
    <div class="save-flash" id="save-flash">// SAVED</div>
  </div>

  <div class="tabs">
    <div class="tab active-a" id="tab-a" onclick="switchSession('a')">SESSION A</div>
    <div class="tab"          id="tab-b" onclick="switchSession('b')">SESSION B</div>
    <div class="tab"          id="tab-r" onclick="switchSession('r')">EXTRA</div>
  </div>

  <div class="section-head">
    <span class="sh-txt" id="session-head">// SESSION A</span>
    <div class="sh-line"></div>
  </div>

  <div class="exercise-list" id="exercise-list"></div>

  <div class="section-head">
    <span class="sh-txt">// NOTES</span>
    <div class="sh-line"></div>
  </div>
  <textarea class="notes-input" id="notes-input" rows="3"
    placeholder="how did it feel, PRs, notes..."
    oninput="saveNotes()"></textarea>

  <div class="footer">
    <span class="footer-txt">// DATA STORED LOCALLY</span>
    <button class="reset-btn" onclick="confirmReset()">RESET SESSION</button>
  </div>

</div>
<script>
// ── MODES ─────────────────────────────────────────────────────────
// 0 = W + SETS + REPS
// 1 = SETS + REPS
// 2 = SETS + SECS
const MODES = [
  { label: 'W+S+R', hasW: true,  rLabel: 'REPS' },
  { label: 'S+R',   hasW: false, rLabel: 'REPS' },
  { label: 'S+SEC', hasW: false, rLabel: 'SECS' },
];

// ── CONFIG ────────────────────────────────────────────────────────
const SESSIONS = {
  a: {
    label: 'SESSION A', color: 'a',
    exercises: [
      { id: 'a_bench',   name: 'BARBELL BENCH PRESS',    wStep: 2.5, sStep: 1, rStep: 1,  defW: 60, defS: 4, defR: 8,  defMode: 0 },
      { id: 'a_incline', name: 'INCLINE DB BENCH PRESS', wStep: 2,   sStep: 1, rStep: 1,  defW: 20, defS: 3, defR: 10, defMode: 0 },
      { id: 'a_fly',     name: 'DUMBBELL FLY',           wStep: 2,   sStep: 1, rStep: 1,  defW: 12, defS: 3, defR: 12, defMode: 0 },
      { id: 'a_chinup',  name: 'CHIN UPS',               wStep: 2.5, sStep: 1, rStep: 1,  defW: 0,  defS: 4, defR: 8,  defMode: 1 },
      { id: 'a_cable',   name: 'CABLE PULL',             wStep: 2.5, sStep: 1, rStep: 1,  defW: 40, defS: 4, defR: 10, defMode: 0 },
      { id: 'a_curl',    name: 'EZ-BAR CURL',            wStep: 2.5, sStep: 1, rStep: 1,  defW: 25, defS: 3, defR: 12, defMode: 0 },
      { id: 'a_french',  name: 'FRENCH PRESS',           wStep: 2.5, sStep: 1, rStep: 1,  defW: 20, defS: 3, defR: 12, defMode: 0 },
      { id: 'a_tricep',  name: 'CABLE TRICEPS PUSHDOWN', wStep: 2.5, sStep: 1, rStep: 1,  defW: 25, defS: 3, defR: 12, defMode: 0 },
      { id: 'a_core',    name: 'CORE',                   wStep: 2.5, sStep: 1, rStep: 5,  defW: 0,  defS: 3, defR: 30, defMode: 2 },
    ]
  },
  b: {
    label: 'SESSION B', color: 'b',
    exercises: [
      { id: 'b_squat',    name: 'SMITH MACHINE SQUAT',  wStep: 5,   sStep: 1, rStep: 1,  defW: 60, defS: 4, defR: 10, defMode: 0 },
      { id: 'b_legpress', name: 'LEG PRESS',            wStep: 5,   sStep: 1, rStep: 1,  defW: 80, defS: 4, defR: 10, defMode: 0 },
      { id: 'b_legext',   name: 'LEG EXTENSION',        wStep: 2.5, sStep: 1, rStep: 1,  defW: 40, defS: 3, defR: 12, defMode: 0 },
      { id: 'b_legcurl',  name: 'LEG CURL',             wStep: 2.5, sStep: 1, rStep: 1,  defW: 35, defS: 3, defR: 12, defMode: 0 },
      { id: 'b_shoulder', name: 'DB SHOULDER PRESS',    wStep: 2,   sStep: 1, rStep: 1,  defW: 16, defS: 4, defR: 10, defMode: 0 },
      { id: 'b_lateral',  name: 'LYING LATERAL RAISE',  wStep: 1,   sStep: 1, rStep: 1,  defW: 8,  defS: 3, defR: 15, defMode: 0 },
      { id: 'b_extra1',   name: '+ ADD EXERCISE',       wStep: 2.5, sStep: 1, rStep: 1,  defW: 0,  defS: 3, defR: 10, defMode: 0 },
      { id: 'b_extra2',   name: '+ ADD EXERCISE',       wStep: 2.5, sStep: 1, rStep: 1,  defW: 0,  defS: 3, defR: 10, defMode: 0 },
      { id: 'b_core',     name: 'CORE',                 wStep: 2.5, sStep: 1, rStep: 5,  defW: 0,  defS: 3, defR: 30, defMode: 2 },
    ]
  },
  r: {
    label: 'EXTRA', color: 'r',
    exercises: [
      { id: 'r_calfraise', name: 'CALF RAISE',                wStep: 2.5, sStep: 1, rStep: 1, defW: 0, defS: 3, defR: 15, defMode: 0 },
      { id: 'r_calfpress', name: 'CALF PRESS',                wStep: 5,   sStep: 1, rStep: 1, defW: 0, defS: 3, defR: 15, defMode: 0 },
      { id: 'r_gastroc',   name: 'GASTROC / GINOCCHIO TESO', wStep: 2.5, sStep: 1, rStep: 5, defW: 0, defS: 3, defR: 30, defMode: 2 },
      { id: 'r_soleo',     name: 'SOLEO / GINOCCHIO FLESSO', wStep: 2.5, sStep: 1, rStep: 5, defW: 0, defS: 3, defR: 30, defMode: 2 },
      { id: 'r_extra1',    name: '+ ADD EXERCISE',           wStep: 2.5, sStep: 1, rStep: 1, defW: 0, defS: 3, defR: 10, defMode: 0 },
      { id: 'r_extra2',    name: '+ ADD EXERCISE',           wStep: 2.5, sStep: 1, rStep: 1, defW: 0, defS: 3, defR: 10, defMode: 0 },
      { id: 'r_extra3',    name: '+ ADD EXERCISE',           wStep: 2.5, sStep: 1, rStep: 1, defW: 0, defS: 3, defR: 10, defMode: 0 },
      { id: 'r_extra4',    name: '+ ADD EXERCISE',           wStep: 2.5, sStep: 1, rStep: 1, defW: 0, defS: 3, defR: 10, defMode: 0 },
      { id: 'r_extra5',    name: '+ ADD EXERCISE',           wStep: 2.5, sStep: 1, rStep: 1, defW: 0, defS: 3, defR: 10, defMode: 0 },
    ]
  }
};

// ── STATE ─────────────────────────────────────────────────────────
let activeSession = 'a';

const sKey  = s => `gym_${s}`;
const nKey  = s => `gym_notes_${s}`;
const cKey  = s => `gym_names_${s}`;
const mKey  = s => `gym_modes_${s}`;

const loadS = s => { try { return JSON.parse(localStorage.getItem(sKey(s))) || {}; } catch { return {}; } };
const saveS = (s, d) => { localStorage.setItem(sKey(s), JSON.stringify(d)); flash(); };
const loadN = s => localStorage.getItem(nKey(s)) || '';
const saveN = (s, v) => localStorage.setItem(nKey(s), v);
const loadC = s => { try { return JSON.parse(localStorage.getItem(cKey(s))) || {}; } catch { return {}; } };
const saveC = (s, d) => { localStorage.setItem(cKey(s), JSON.stringify(d)); };
const loadM = s => { try { return JSON.parse(localStorage.getItem(mKey(s))) || {}; } catch { return {}; } };
const saveM = (s, d) => { localStorage.setItem(mKey(s), JSON.stringify(d)); };

// ── ACTIONS ───────────────────────────────────────────────────────
function change(exId, field, delta) {
  const sess = activeSession;
  const cfg  = SESSIONS[sess].exercises.find(e => e.id === exId);
  const data = loadS(sess);
  if (!data[exId]) data[exId] = { w: cfg.defW, s: cfg.defS, r: cfg.defR };
  const minVal = field === 'w' ? 0 : 1;
  data[exId][field] = Math.max(minVal, parseFloat((data[exId][field] + delta).toFixed(1)));
  saveS(sess, data);
  const el = document.getElementById(`val-${exId}-${field}`);
  if (el) {
    el.textContent = field === 'w' ? fmtW(data[exId][field]) : data[exId][field];
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  }
}

function cycleMode(exId) {
  const modes   = loadM(activeSession);
  const cfg     = SESSIONS[activeSession].exercises.find(e => e.id === exId);
  const current = modes[exId] !== undefined ? modes[exId] : cfg.defMode;
  modes[exId]   = (current + 1) % 3;
  saveM(activeSession, modes);
  renderAll();
}

function saveName(exId, value) {
  const names   = loadC(activeSession);
  const cleaned = value.toUpperCase().trim();
  if (cleaned) {
    names[exId] = cleaned;
  } else {
    delete names[exId]; // empty input reverts to config default
  }
  saveC(activeSession, names);
  flash();
}

function saveNotes() {
  saveN(activeSession, document.getElementById('notes-input').value);
  flash();
}

function switchSession(sess) {
  activeSession = sess;
  ['a','b','r'].forEach(s => {
    document.getElementById(`tab-${s}`).className = `tab${s === sess ? ` active-${s}` : ''}`;
  });
  document.getElementById('session-head').textContent = `// ${SESSIONS[sess].label}`;
  renderAll();
}

function confirmReset() {
  if (!confirm(`Reset ${SESSIONS[activeSession].label} to defaults?`)) return;
  localStorage.removeItem(sKey(activeSession));
  localStorage.removeItem(nKey(activeSession));
  localStorage.removeItem(cKey(activeSession));
  localStorage.removeItem(mKey(activeSession));
  renderAll();
}

// ── HELPERS ───────────────────────────────────────────────────────
function flash() {
  const el = document.getElementById('save-flash');
  el.classList.add('show');
  clearTimeout(window._ft);
  window._ft = setTimeout(() => el.classList.remove('show'), 1500);
}

const fmtW = v => Number.isInteger(v) ? `${v}kg` : `${v.toFixed(1)}kg`;

// ── RENDER ────────────────────────────────────────────────────────
function renderAll() {
  const sess  = activeSession;
  const cfg   = SESSIONS[sess];
  const data  = loadS(sess);
  const names = loadC(sess);
  const modes = loadM(sess);

  document.getElementById('exercise-list').innerHTML = cfg.exercises.map(ex => {
    const saved       = data[ex.id] || {};
    const w           = saved.w !== undefined ? saved.w : ex.defW;
    const s           = saved.s !== undefined ? saved.s : ex.defS;
    const r           = saved.r !== undefined ? saved.r : ex.defR;
    const displayName = names[ex.id] || ex.name;
    const modeIdx     = modes[ex.id] !== undefined ? modes[ex.id] : ex.defMode;
    const mode        = MODES[modeIdx];
    const colClass    = mode.hasW ? 'three-col' : 'two-col';
    const rStep       = mode.rLabel === 'SECS' ? 5 : ex.rStep;

    const weightCol = !mode.hasW ? '' : `
      <div class="ex-ctrl">
        <span class="ex-ctrl-label">WEIGHT</span>
        <div class="ex-ctrl-row">
          <button class="ctrl-btn m" onclick="change('${ex.id}','w',${-ex.wStep})">-</button>
          <span class="ctrl-val" id="val-${ex.id}-w">${fmtW(w)}</span>
          <button class="ctrl-btn p" onclick="change('${ex.id}','w',${ex.wStep})">+</button>
        </div>
      </div>`;

    return `
    <div class="ex-row session-${cfg.color}">
      <div class="ex-top">
        <input class="ex-name-input"
               value="${displayName}"
               onblur="saveName('${ex.id}', this.value)"
               onkeydown="if(event.key==='Enter') this.blur()"
               placeholder="+ ADD EXERCISE">
        <button class="mode-btn active" onclick="cycleMode('${ex.id}')">${mode.label}</button>
      </div>
      <div class="ex-controls ${colClass}">
        ${weightCol}
        <div class="ex-ctrl">
          <span class="ex-ctrl-label">SETS</span>
          <div class="ex-ctrl-row">
            <button class="ctrl-btn m" onclick="change('${ex.id}','s',${-ex.sStep})">-</button>
            <span class="ctrl-val" id="val-${ex.id}-s">${s}</span>
            <button class="ctrl-btn p" onclick="change('${ex.id}','s',${ex.sStep})">+</button>
          </div>
        </div>
        <div class="ex-ctrl">
          <span class="ex-ctrl-label">${mode.rLabel}</span>
          <div class="ex-ctrl-row">
            <button class="ctrl-btn m" onclick="change('${ex.id}','r',${-rStep})">-</button>
            <span class="ctrl-val" id="val-${ex.id}-r">${r}</span>
            <button class="ctrl-btn p" onclick="change('${ex.id}','r',${rStep})">+</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('notes-input').value = loadN(sess);
}

renderAll();
</script>
</body>
</html>
